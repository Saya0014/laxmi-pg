<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Laxmi PG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4fb;--card:#fff;--tx:#1f1b2e;--mu:#6b6780;--pr:#7c3aed;--prt:#fff;--ok:#16a34a;--bad:#dc2626;--bd:#e5e1f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14111f;--card:#1e1a2e;--tx:#f1eefb;--mu:#a29db8;--pr:#a78bfa;--prt:#14111f;--bd:#2f2a45}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14111f;--card:#1e1a2e;--tx:#f1eefb;--mu:#a29db8;--pr:#a78bfa;--prt:#14111f;--bd:#2f2a45}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:76px}
header{background:var(--pr);color:var(--prt);padding:16px 16px 14px}
header h1{margin:0;font-size:20px}header p{margin:2px 0 0;font-size:13px;opacity:.85}
main{max-width:640px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .card{margin:0}
.stat b{display:block;font-size:22px}.stat span{color:var(--mu);font-size:12px}
h2{font-size:16px;margin:0 0 10px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:8px}
button,.btn{background:var(--pr);color:var(--prt);border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.ghost{background:transparent;color:var(--bad);border:1px solid var(--bd)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--bd)}
h2+.row{border-top:0}
.mu{color:var(--mu);font-size:13px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;font-weight:600}
.paid{background:#16a34a22;color:var(--ok)}.due{background:#dc262622;color:var(--bad)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mt{margin-top:12px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:10px 4px;font-size:12px}
nav button.on{color:var(--pr)}
nav button span{display:block;font-size:20px}
label{font-size:12px;color:var(--mu)}
:root{--bg:#f5f3ff;--g:linear-gradient(135deg,#7c3aed 0%,#c026d3 55%,#ec4899 100%);--sh:0 10px 28px -12px rgba(124,58,237,.45)}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:104px}
header{display:flex;align-items:center;gap:14px;background:var(--g);color:#fff;border-radius:0 0 30px 30px;padding:22px 20px 28px;box-shadow:var(--sh)}
header h1{font-size:24px;font-weight:800;letter-spacing:-.4px;color:#fff}
header p{color:#fff;opacity:.88;font-weight:500}
.logo{width:50px;height:50px;border-radius:16px;background:rgba(255,255,255,.22);backdrop-filter:blur(6px);display:grid;place-items:center;font-size:26px}
main{padding:18px 14px}
.card{border-radius:22px;border:1px solid var(--bd);box-shadow:var(--sh);padding:16px}
.grid{gap:12px;margin-bottom:12px}
.stat b{font-size:26px;font-weight:800;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-weight:600;text-transform:uppercase;letter-spacing:.5px;font-size:11px}
h2{font-size:17px;font-weight:800;letter-spacing:-.2px}
input,select{border-radius:14px;padding:12px 14px;border:1.5px solid var(--bd);outline:0;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{border-color:var(--pr);box-shadow:0 0 0 4px rgba(124,58,237,.15)}
button,.btn{background:var(--g);color:#fff;border-radius:999px;padding:10px 18px;box-shadow:0 8px 18px -8px rgba(192,38,211,.6);transition:transform .15s}
button:active,.btn:active{transform:scale(.96)}
.ghost{background:none;box-shadow:none;color:var(--bad);border:1.5px solid var(--bd);padding:7px 14px}
.tag{padding:4px 11px;font-weight:700}
.row{padding:12px 0}
.who{display:flex;align-items:center;gap:12px}
.av{width:42px;height:42px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:17px;flex:none}
.bar{height:6px;width:140px;border-radius:9px;background:var(--bd);margin-top:7px;overflow:hidden}
.bar u{display:block;height:100%;background:var(--g);border-radius:9px;transition:width .4s}
nav{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:6px;max-width:600px;margin:0 auto;border-radius:26px;border:1px solid var(--bd);box-shadow:var(--sh)}
nav button{background:none;box-shadow:none;color:var(--mu);border-radius:20px;padding:8px 4px;font-weight:700}
nav button.on{background:rgba(124,58,237,.12);color:var(--pr)}
main>*{animation:up .4s both}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
header{position:relative;overflow:hidden}header>div{position:relative;z-index:1}
.b1,.b2{position:absolute;border-radius:50%;background:rgba(255,255,255,.16);animation:fl 7s ease-in-out infinite}
.b1{width:130px;height:130px;right:-30px;top:-40px}.b2{width:70px;height:70px;right:80px;bottom:-26px;animation-delay:-3s}
@keyframes fl{50%{transform:translate(-10px,12px) scale(1.08)}}
@media(prefers-reduced-motion:reduce){.b1,.b2{animation:none}}
.ringc{display:flex;align-items:center;gap:16px}
.ring{width:84px;height:84px;border-radius:50%;background:conic-gradient(#c026d3 calc(var(--p)*1%),var(--bd) 0);display:grid;place-items:center;flex:none;position:relative}
.ring::before{content:"";position:absolute;inset:9px;background:var(--card);border-radius:50%}
.ring span{position:relative;font-weight:800;font-size:18px}
.beds{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.beds i{width:28px;height:28px;border-radius:9px;border:1.5px dashed var(--bd);display:grid;place-items:center;font-size:14px;font-style:normal;filter:grayscale(1);opacity:.5}
.beds i.on{background:var(--g);border:0;filter:none;opacity:1}
@media(prefers-reduced-motion:reduce){main>*{animation:none}}
</style>
</head>
<body>
<header><div class="logo">🏠</div><div><h1>Laxmi PG</h1><p id="gr"></p></div><i class="b1"></i><i class="b2"></i></header>
<main id="m"></main>
<nav id="n"></nav>
<script>
const ROOMS=[1,2,3],CAPS={1:7,2:3,3:2};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S={rent:1500,rate:8,girls:[],read:{},paid:{}};
try{const x=localStorage.getItem("laxmipg");if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
const save=()=>{try{localStorage.setItem("laxmipg",JSON.stringify(S))}catch(e){}};
let tab="home",month=new Date().toISOString().slice(0,7);
const prevM=m=>{const d=new Date(m+"-01");d.setMonth(d.getMonth()-1);return d.toISOString().slice(0,7)};
const rd=r=>{const x=(S.read[month]||{})[r]||{};const p=x.p!=null?x.p:((S.read[prevM(month)]||{})[r]||{}).c;return{p:p==null?"":p,c:x.c==null?"":x.c}};
const inRoom=r=>S.girls.filter(g=>g.room==r);
const light=r=>{const x=rd(r),u=Math.max(0,(+x.c||0)-(+x.p||0));return u*S.rate};
const lightShare=g=>{const n=inRoom(g.room).length;return n?Math.round(light(g.room)/n):0};
const total=g=>(+S.rent)+lightShare(g);
const isPaid=g=>((S.paid[month]||{})[g.id])===true;
const money=n=>"₹"+Math.round(n).toLocaleString("en-IN");
const monthBar=()=>`<div class="card"><label>Month</label><input type="month" value="${month}" onchange="month=this.value||month;R()" style="margin:0"></div>`;
function R(){
const m=document.getElementById("m");const hr=new Date().getHours();document.getElementById("gr").textContent=(hr<12?"Good morning ☀️":hr<17?"Good afternoon 🌤️":"Good evening 🌙")+" · 12 Beds";
document.getElementById("n").innerHTML=[["home","📊","Home"],["girls","👩","Girls"],["light","💡","Light"],["bills","🧾","Bills"]].map(t=>`<button class="${tab==t[0]?"on":""}" onclick="tab='${t[0]}';R()"><span>${t[1]}</span>${t[2]}</button>`).join("");
if(tab=="home"){
const exp=S.girls.reduce((a,g)=>a+total(g),0),got=S.girls.filter(isPaid).reduce((a,g)=>a+total(g),0);
m.innerHTML=monthBar()+`<div class="card ringc"><div class="ring" style="--p:${exp?Math.round(got/exp*100):0}"><span>${exp?Math.round(got/exp*100):0}%</span></div><div><h2 style="margin:0 0 4px">Rent collection</h2><div class="mu">${S.girls.filter(isPaid).length} of ${S.girls.length} girls have paid</div><div class="mu">${exp&&got>=exp?"All done! 🎉":"Keep going 💪"}</div></div></div><div class="grid"><div class="card stat"><b>${S.girls.length}/12</b><span>Girls / Beds</span></div><div class="card stat"><b>${12-S.girls.length}</b><span>Empty beds</span></div><div class="card stat"><b style="color:var(--ok)">${money(got)}</b><span>Collected</span></div><div class="card stat"><b style="color:var(--bad)">${money(exp-got)}</b><span>Pending</span></div></div>`+
`<div class="card mt"><h2>🏡 Rooms</h2>${ROOMS.map(r=>`<div class="row"><div><b>Room ${r}</b><div class="mu">${inRoom(r).map(g=>esc(g.name)).join(", ")||"Empty"}</div><div class="beds">${Array.from({length:CAPS[r]},(_,i)=>`<i class="${i<inRoom(r).length?"on":""}">🛏</i>`).join("")}</div></div><span class="tag ${inRoom(r).length>=CAPS[r]?"due":"paid"}">${inRoom(r).length}/${CAPS[r]}</span></div>`).join("")}</div>`+
`<div class="card"><h2>⚙️ Settings</h2><div class="two"><div><label>Rent / girl (₹)</label><input type="number" value="${S.rent}" onchange="S.rent=+this.value;save();R()"></div><div><label>Light rate / unit (₹)</label><input type="number" step="0.5" value="${S.rate}" onchange="S.rate=+this.value;save();R()"></div></div></div>`;
}
if(tab=="girls"){
m.innerHTML=`<div class="card"><h2>🌸 Add a new girl</h2><input id="nm" placeholder="Name"><input id="ph" type="tel" placeholder="Phone number (10 digits)"><select id="rm">${ROOMS.map(r=>`<option value="${r}">Room ${r} (${inRoom(r).length}/${CAPS[r]})</option>`).join("")}</select><button onclick="addG()">+ Add</button></div>`+
`<div class="card"><h2>All girls (${S.girls.length})</h2>${S.girls.map(g=>`<div class="row"><div class="who"><i class="av" style="background:hsl(${g.room*110+260} 70% 55%)">${esc(g.name.charAt(0).toUpperCase())}</i><div><b>${esc(g.name)}</b><div class="mu">Room ${g.room} · ${esc(g.phone||"-")}</div></div></div><button class="ghost" onclick="delG('${g.id}')">Remove</button></div>`).join("")||'<p class="mu" style="text-align:center;font-size:15px">🌸 No girls added yet.<br>Add your first girl above!</p>'}</div>`;
}
if(tab=="light"){
m.innerHTML=monthBar()+ROOMS.map(r=>{const x=rd(r),n=inRoom(r).length,u=Math.max(0,(+x.c||0)-(+x.p||0));return `<div class="card"><h2>💡 Room ${r} meter</h2><div class="two"><div><label>Previous reading</label><input type="number" value="${x.p}" onchange="setR(${r},'p',this.value)"></div><div><label>Current reading</label><input type="number" value="${x.c}" onchange="setR(${r},'c',this.value)"></div></div><div class="mu">${u} unit × ₹${S.rate} = <b>${money(u*S.rate)}</b>${n?` · each girl’s share <b>${money(u*S.rate/n)}</b>`:""}</div></div>`}).join("");
}
if(tab=="bills"){
m.innerHTML=monthBar()+`<div class="card"><h2>🧾 Bills – ${month}</h2>${S.girls.map(g=>{const t=total(g),msg=encodeURIComponent(`Hello ${g.name}, your Laxmi PG bill for ${month}: Rent ${money(S.rent)} + Light ${money(lightShare(g))} = ${money(t)}. Please pay at the earliest. Thank you.`);const ph=(g.phone||"").replace(/\D/g,"").slice(-10);return `<div class="row" style="flex-wrap:wrap"><div><b>${esc(g.name)}</b> <span class="tag ${isPaid(g)?"paid":"due"}">${isPaid(g)?"Paid":"Pending"}</span><div class="mu">Room ${g.room} · Rent ${money(S.rent)} + Light ${money(lightShare(g))}</div></div><b>${money(t)}</b><div style="width:100%;display:flex;gap:8px"><button onclick="tgl('${g.id}')">${isPaid(g)?"Mark unpaid":"✓ Mark paid"}</button>${ph?`<a class="btn" style="background:#16a34a;color:#fff" target="_blank" rel="noopener" href="https://wa.me/91${ph}?text=${msg}">WhatsApp</a>`:""}</div></div>`}).join("")||'<p class="mu">Add girls first.</p>'}</div>`;
}
}
function addG(){const n=document.getElementById("nm").value.trim(),p=document.getElementById("ph").value.trim(),r=+document.getElementById("rm").value;if(!n)return alert("Enter a name");if(inRoom(r).length>=CAPS[r])return alert("Room "+r+" is full");if(S.girls.length>=12)return alert("All 12 beds are full");S.girls.push({id:"g"+Date.now(),name:n,phone:p,room:r});save();R()}
function delG(id){if(confirm("Remove this girl?")){S.girls=S.girls.filter(g=>g.id!=id);save();R()}}
function setR(r,k,v){S.read[month]=S.read[month]||{};S.read[month][r]=S.read[month][r]||{};S.read[month][r][k]=v===""?null:+v;save();R()}
function burst(){const e=["🎉","✨","💜","🌸","⭐"];for(let i=0;i<22;i++){const s=document.createElement("span");s.textContent=e[i%5];s.style.cssText="position:fixed;left:50%;top:55%;font-size:22px;pointer-events:none;z-index:99";document.body.appendChild(s);const a=Math.random()*6.28,d=90+Math.random()*140;s.animate([{transform:"translate(-50%,-50%)",opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d-60}px)) rotate(${Math.random()*360}deg)`,opacity:0}],{duration:900,easing:"ease-out"}).onfinish=()=>s.remove()}}
function tgl(id){S.paid[month]=S.paid[month]||{};S.paid[month][id]=!S.paid[month][id];save();R();if(S.paid[month][id])burst()}
R();
</script>
</body>
</html>
